<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 底板深紫渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1035" />
      <stop offset="100%" stop-color="#0F071E" />
    </linearGradient>

    <!-- 外框高光描边渐变 -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6B21A8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3B0764" stop-opacity="0.1" />
    </linearGradient>

    <!-- 左侧长胶囊：电光紫渐变 -->
    <linearGradient id="bar1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>

    <!-- 中间中胶囊：兰花紫渐变 -->
    <linearGradient id="bar2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D8B4FE" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- 右侧短胶囊：高亮薰衣草紫渐变 -->
    <linearGradient id="bar3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3E8FF" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- 柔和发光阴影 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#9333EA" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 现代圆角底板 -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bgGrad)" />
  <rect x="26" y="26" width="460" height="460" rx="114" fill="none" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- 核心图形：视觉重心向右微调校准 (+14px) -->
  <g filter="url(#glow)" transform="translate(14, 0)">
    <!-- 左柱（长） -->
    <rect x="132" y="128" width="56" height="256" rx="28" fill="url(#bar1Grad)" />
    <!-- 中柱（中） -->
    <rect x="220" y="172" width="56" height="168" rx="28" fill="url(#bar2Grad)" />
    <!-- 右柱（短） -->
    <rect x="308" y="216" width="56" height="80" rx="28" fill="url(#bar3Grad)" />
  </g>
</svg>